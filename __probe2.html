<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<iframe id="f" src="/index.html" style="width:390px;height:2400px;border:0"></iframe>
<script>
window.addEventListener('load', function(){
  setTimeout(function(){
    try {
      var d = document.getElementById('f').contentDocument.documentElement;
      var overflow = d.scrollWidth - d.clientWidth;
      var els = document.getElementById('f').contentDocument.querySelectorAll('*');
      var bad = [];
      for (var i=0;i<els.length;i++){ var r = els[i].getBoundingClientRect(); if (r.right > 391 || r.left < -1) { var cn=(els[i].className||'').toString().slice(0,50); if (cn.indexOf('skip-link')>=0) continue; bad.push(els[i].tagName + '.' + cn + '=' + Math.round(r.left)+'..'+Math.round(r.right)); if(bad.length>10) break; } }
      document.title = 'OVERFLOW390:' + overflow + '|' + bad.join(' ; ');
    } catch(e){ document.title = 'ERR:' + e; }
  }, 500);
});
</script></body></html>
